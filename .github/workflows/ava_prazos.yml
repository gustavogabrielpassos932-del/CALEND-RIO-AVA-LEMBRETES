name: Prazos AVA UniEVANGELICA

on:
  schedule:
    # 07:33 BRT = 10:33 UTC | 19:33 BRT = 22:33 UTC
    - cron: '33 10,22 * * *'
  workflow_dispatch:

jobs:
  notificar-prazos:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Consultar AVA e enviar push para iPhone
        env:
          AVA_ICS_URL: ${{ secrets.AVA_ICS_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_ava.py
